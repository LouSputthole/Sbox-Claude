name: privacy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  repository-privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Reject machine-specific user paths
        run: node scripts/audit-repo-privacy.mjs
